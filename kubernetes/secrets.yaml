apiVersion: v1
kind: Secret
metadata:
  name: azure-mysql-secret
  namespace: hospital-system
  labels:
    app: hospital-backend
    database: azure-mysql
type: Opaque
data:
  env:
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_HOST

  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_NAME

  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_USER

  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_PASSWORD

  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_PORT
